# 臨時探測：確認 GitHub Actions 的機器連不連得到聯卡中心（NCCC）小額支付平台頁面與通路名單 CSV。
# 只印出連線結果，不改任何檔案；看完結果就會刪掉這個檔。
name: NCCC probe (temporary)
on:
  push:
    branches: ['claude/optimistic-gates-kjypzu']
    paths: ['.github/workflows/nccc-probe.yml']
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch page and CSV
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          BASE='https://www.nccc.com.tw/wps/wcm/connect'
          curl -sS -L -m 60 -A "$UA" -o page.html -w 'PAGE http=%{http_code} size=%{size_download}\n' "$BASE/zh/home/BusinessOperations/CardBusiness/MicroPayment" || echo "PAGE curl failed: $?"
          grep -o '小額支付平台通路名單下載([^)]*)' page.html | head -1 || echo 'PAGE date string not found'
          curl -sS -L -m 120 -A "$UA" -D headers.txt -o list.csv -w 'CSV http=%{http_code} size=%{size_download}\n' "$BASE/ed441cc0-d955-42ee-8e12-c85c78470993/SMALL_TICKET_PLATFORM_MERCHANTS.CSV?MOD=AJPERES" || echo "CSV curl failed: $?"
          grep -i '^etag' headers.txt || echo 'CSV no etag'
          echo "CSV lines: $(wc -l < list.csv)"
          head -c 300 list.csv | iconv -f BIG5-HKSCS -t UTF-8 -c | head -2
