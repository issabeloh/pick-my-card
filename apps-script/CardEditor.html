<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<!--
  單卡編輯器側邊欄（搭配 card-editor.gs，2026-11-11 新增）。
  在 Apps Script 編輯器裡要建成「HTML」檔，檔名必須是 CardEditor（不含 .html）。
  所有來自試算表的文字一律用 textContent 放進畫面，不用 innerHTML。
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 Arial, "Noto Sans TC", sans-serif; color: #202124; background: #fff; }
  #top { position: sticky; top: 0; z-index: 5; background: #fff; padding: 10px 12px 8px; border-bottom: 1px solid #e0e0e0; }
  #filter, #cardSelect { width: 100%; padding: 6px 8px; border: 1px solid #c4c7c5; border-radius: 6px; font: inherit; }
  #cardSelect { margin-top: 6px; }
  #status { margin-top: 6px; font-size: 12px; color: #5f6368; min-height: 1em; }
  #status.err { color: #c5221f; }
  #status.ok { color: #188038; }
  #main { padding: 4px 12px 120px; }
  h2 { font-size: 13px; margin: 16px 0 6px; color: #1a73e8; display: flex; align-items: center; justify-content: space-between; }
  details.slot { border: 1px solid #e0e0e0; border-radius: 8px; margin: 6px 0; background: #fff; }
  details.slot > summary { cursor: pointer; padding: 6px 8px; list-style: none; display: flex; gap: 6px; align-items: baseline; }
  details.slot > summary::-webkit-details-marker { display: none; }
  details.slot > summary::before { content: "▸"; color: #80868b; }
  details.slot[open] > summary::before { content: "▾"; }
  details.slot.empty > summary { color: #9aa0a6; padding: 3px 8px; }
  details.slot.dirty { border-color: #f9ab00; }
  details.slot.has-err { border-color: #d93025; }
  .sum-n { font-weight: bold; white-space: nowrap; }
  .sum-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .slot-body { padding: 2px 8px 8px; }
  .field { margin: 6px 0; padding-left: 6px; border-left: 3px solid transparent; }
  .field.dirty { border-left-color: #f9ab00; }
  .field.err { border-left-color: #d93025; }
  .field label { display: block; font-size: 11px; color: #5f6368; margin-bottom: 2px; word-break: break-all; }
  .field textarea, .field input[type=text] { width: 100%; padding: 5px 7px; border: 1px solid #c4c7c5; border-radius: 5px; font: inherit; resize: vertical; }
  .field textarea { min-height: 30px; overflow: hidden; }
  .field .ro { padding: 5px 7px; background: #f1f3f4; border-radius: 5px; color: #5f6368; white-space: pre-wrap; word-break: break-all; min-height: 28px; }
  .field .msg { font-size: 11px; color: #d93025; margin-top: 2px; }
  .hint { font-size: 11px; color: #5f6368; margin: 4px 0; }
  .warn { font-size: 12px; color: #b06000; background: #fef7e0; border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
  button { font: inherit; border-radius: 6px; border: 1px solid #c4c7c5; background: #fff; padding: 5px 10px; cursor: pointer; }
  button:hover { background: #f1f3f4; }
  button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  button.primary:disabled { background: #a8c7fa; border-color: #a8c7fa; cursor: default; }
  button.link { border: none; background: none; color: #1a73e8; padding: 2px 4px; }
  button.danger { color: #c5221f; }
  .add-slot { width: 100%; margin-top: 4px; border-style: dashed; color: #1a73e8; }
  /* 級別 */
  .level { border: 1px solid #e0e0e0; border-radius: 8px; padding: 8px; margin: 8px 0; }
  .level.renamed { border-color: #f9ab00; }
  .level-head { display: flex; gap: 6px; align-items: center; }
  .level-head input { flex: 1; font-weight: bold; padding: 5px 7px; border: 1px solid #c4c7c5; border-radius: 5px; font-size: 13px; }
  .tag { font-size: 11px; background: #e8f0fe; color: #1967d2; border-radius: 10px; padding: 1px 7px; white-space: nowrap; }
  .kv { display: grid; grid-template-columns: 38% 1fr auto; gap: 4px; margin-top: 4px; align-items: start; }
  .kv input, .kv textarea { width: 100%; padding: 4px 6px; border: 1px solid #c4c7c5; border-radius: 5px; font: inherit; font-size: 12px; resize: vertical; }
  .kv textarea { min-height: 26px; overflow: hidden; }
  .kv button { padding: 2px 6px; }
  #rawLevels { width: 100%; min-height: 220px; font: 12px/1.4 monospace; padding: 6px; border: 1px solid #c4c7c5; border-radius: 6px; }
  /* 底部存檔列 */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #e0e0e0; padding: 8px 12px; z-index: 6; }
  #bar .row { display: flex; gap: 6px; }
  #bar .row button.primary { flex: 1; }
  #issues { max-height: 38vh; overflow: auto; margin-bottom: 6px; }
  #issues:empty { display: none; }
  .issue { font-size: 12px; padding: 5px 7px; margin: 3px 0; background: #fce8e6; border-radius: 6px; cursor: pointer; }
  .issue b { color: #c5221f; }
  .issue.conflict { background: #fef7e0; cursor: default; }
  /* 確認視窗 */
  #modal { position: fixed; inset: 0; background: rgba(32,33,36,.45); display: none; align-items: center; justify-content: center; z-index: 20; padding: 12px; }
  #modal.show { display: flex; }
  #modal .box { background: #fff; border-radius: 10px; padding: 14px; max-width: 100%; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  #modal .box h3 { margin: 0 0 8px; font-size: 14px; color: #c5221f; }
  #modal .box .body { white-space: pre-wrap; font-size: 12.5px; }
  #modal .box .btns { display: flex; gap: 6px; justify-content: flex-end; margin-top: 12px; }
  .empty-state { color: #5f6368; padding: 24px 4px; text-align: center; }
</style>
</head>
<body>
<div id="top">
  <input id="filter" type="text" placeholder="🔍 打字篩選卡片（id 或名稱）">
  <select id="cardSelect"><option value="">載入卡片清單中…</option></select>
  <div id="status"></div>
</div>

<div id="main"><div class="empty-state">選一張卡開始編輯</div></div>

<div id="bar" style="display:none">
  <div id="issues"></div>
  <div class="row">
    <button id="saveBtn" class="primary" disabled>沒有修改</button>
    <button id="revertBtn" title="放棄所有還沒存的修改">還原</button>
  </div>
</div>

<div id="modal"><div class="box">
  <h3 id="modalTitle"></h3>
  <div class="body" id="modalBody"></div>
  <div class="btns"><button id="modalCancel">取消</button><button id="modalOk" class="primary">確定</button></div>
</div></div>

<script>
(function() {
  'use strict';

  // ---------- 狀態 ----------
  var allCards = [];
  var card = null;        // cardEditorLoad 的結果
  var orig = {};          // 欄位名 → 載入時的值（字串）
  var cur = {};           // 欄位名 → 目前畫面上的值
  var fieldEls = {};      // 欄位名 → .field 元素
  var slotOf = {};        // 欄位名 → details 元素
  var level = null;       // 級別編輯器狀態
  var busy = false;

  var $ = function(id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function status(msg, kind) { var s = $('status'); s.textContent = msg || ''; s.className = kind || ''; }

  function run(fn, args, ok) {
    busy = true;
    var runner = google.script.run
      .withSuccessHandler(function(r) { busy = false; ok(r); })
      .withFailureHandler(function(e) { busy = false; status('❌ ' + (e && e.message || e), 'err'); refreshBar(); });
    runner[fn].apply(runner, args);
  }

  // ---------- 確認視窗 ----------
  function confirmBox(title, body, okText, onOk, onCancel) {
    $('modalTitle').textContent = title;
    $('modalBody').textContent = body;
    $('modalOk').textContent = okText || '確定';
    $('modal').className = 'show';
    $('modalOk').onclick = function() { $('modal').className = ''; onOk && onOk(); };
    $('modalCancel').onclick = function() { $('modal').className = ''; onCancel && onCancel(); };
  }

  // ---------- 卡片清單 ----------
  function renderCardList() {
    var q = $('filter').value.trim().toLowerCase();
    var sel = $('cardSelect');
    var keep = card ? card.id : '';
    sel.textContent = '';
    var first = el('option', null, '— 選擇卡片（共 ' + allCards.length + ' 張）—');
    first.value = '';
    sel.appendChild(first);
    allCards.forEach(function(c) {
      if (q && (c.id + ' ' + c.name).toLowerCase().indexOf(q) < 0 && c.id !== keep) return;
      var o = el('option', null, c.name ? c.name + '（' + c.id + '）' : c.id);
      o.value = c.id;
      sel.appendChild(o);
    });
    sel.value = keep;
  }
  $('filter').addEventListener('input', renderCardList);
  $('cardSelect').addEventListener('change', function() {
    var id = this.value;
    if (!id || (card && id === card.id)) return;
    var go = function() { loadCard(id); };
    if (countChanges() > 0) {
      var sel = this;
      confirmBox('還有沒存的修改', '換卡片的話，「' + card.id + '」還沒存的 ' + countChanges() + ' 項修改會不見。', '不存了，換卡片', go,
        function() { sel.value = card.id; });
    } else go();
  });

  function loadCard(id) {
    status('讀取「' + id + '」…');
    run('cardEditorLoad', [id], function(c) { setCard(c); status('已載入「' + id + '」（第 ' + c.rowNumber + ' 列）', 'ok'); });
  }

  // ---------- 畫面 ----------
  function setCard(c) {
    card = c; orig = {}; cur = {}; fieldEls = {}; slotOf = {}; level = null;
    Object.keys(c.fields).forEach(function(k) { orig[k] = c.fields[k].value; cur[k] = c.fields[k].value; });
    $('issues').textContent = '';
    render();
    renderCardList();
  }

  function render() {
    var main = $('main');
    main.textContent = '';
    if (card.duplicates.length) {
      main.appendChild(el('div', 'warn', '⚠️ 表上有重複的欄位標題：' + card.duplicates.join('、') + '。編輯器跟匯出一樣只讀最前面那欄。'));
    }

    main.appendChild(el('h2', null, '基本資料'));
    var baseBox = el('div');
    card.base.forEach(function(f) { baseBox.appendChild(fieldWidget(f)); });
    main.appendChild(baseBox);

    renderSlots(main, '回饋槽位', card.rateSlots, 'rate');
    renderSlots(main, '領券槽位', card.couponSlots, 'coupon');
    renderLevels(main);

    $('bar').style.display = '';
    refreshBar();
  }

  function slotSummary(slot, kind) {
    if (slot.empty && !slotDirty(slot)) return '（空）';
    var a = kind === 'rate' ? ['rate_', 'items_'] : ['couponRate_', 'couponMerchant_'];
    var r = cur[a[0] + slot.n] || '', it = cur[a[1] + slot.n] || '';
    return (r ? r + (/^-?[\d.]+$/.test(r) ? '%' : '') + ' · ' : '') + (it || '（沒填 ' + a[1] + slot.n + '）');
  }
  function slotDirty(slot) { return slot.fields.some(function(f) { return cur[f] !== orig[f]; }); }

  function renderSlots(main, title, slots, kind) {
    var h = el('h2', null, title + '（' + slots.filter(function(s) { return !s.empty; }).length + ' / ' + slots.length + ' 個有資料）');
    main.appendChild(h);
    if (!slots.length) { main.appendChild(el('div', 'hint', '表上沒有這類欄位')); return; }
    slots.forEach(function(slot) {
      var d = el('details', 'slot' + (slot.empty ? ' empty' : ''));
      d.open = !slot.empty;
      d.dataset.kind = kind;
      var s = el('summary');
      s.appendChild(el('span', 'sum-n', (kind === 'rate' ? '槽位 ' : '領券 ') + slot.n));
      var t = el('span', 'sum-txt', slotSummary(slot, kind));
      s.appendChild(t);
      d.appendChild(s);
      var body = el('div', 'slot-body');
      slot.fields.forEach(function(f) { body.appendChild(fieldWidget(f)); slotOf[f] = d; });
      d.appendChild(body);
      d._slot = slot; d._sum = t; d._kind = kind;
      main.appendChild(d);
    });
    var btn = el('button', 'add-slot', '＋ 新增下一個' + (kind === 'rate' ? '回饋' : '領券') + '槽位');
    btn.onclick = function() {
      var target = null;
      document.querySelectorAll('details.slot').forEach(function(d) {
        if (!target && d._kind === kind && d._slot.empty && !slotDirty(d._slot) && !d.open) target = d;
      });
      if (!target) {
        status('表上的' + title + '都用完了。請先在 Cards Data 表上新增下一組欄位（標題照現有格式，如 rate_23、items_23…），再重新打開編輯器。', 'err');
        return;
      }
      target.open = true;
      target.classList.remove('empty');
      target.scrollIntoView({ block: 'start', behavior: 'smooth' });
      var inp = target.querySelector('textarea, input');
      if (inp) inp.focus();
    };
    main.appendChild(btn);
  }

  function autoSize(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }

  function fieldWidget(name) {
    var info = card.fields[name];
    var w = el('div', 'field');
    w.dataset.field = name;
    var lab = el('label', null, name);
    w.appendChild(lab);
    if (info.readonly) {
      var ro = el('div', 'ro', info.value || '（空）');
      ro.title = info.readonlyReason;
      w.appendChild(ro);
      lab.textContent = name + '　🔒 ' + (info.formula ? '公式' : '唯讀');
    } else if (info.kind === 'bool') {
      var cb = el('input'); cb.type = 'checkbox'; cb.checked = cur[name] === 'TRUE';
      cb.onchange = function() { setVal(name, cb.checked ? 'TRUE' : ''); };
      lab.textContent = '';
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(' ' + name));
    } else if (info.kind === 'date') {
      var di = el('input'); di.type = 'text'; di.value = cur[name]; di.placeholder = '例：2026/7/1';
      di.oninput = function() { setVal(name, di.value); };
      w.appendChild(di);
    } else if (name === 'levelSettings') {
      return w;  // 由級別區處理
    } else {
      var ta = el('textarea'); ta.rows = 1; ta.value = cur[name];
      ta.oninput = function() { autoSize(ta); setVal(name, ta.value); };
      w.appendChild(ta);
      setTimeout(function() { autoSize(ta); }, 0);
    }
    fieldEls[name] = w;
    return w;
  }

  function setVal(name, v) {
    cur[name] = v;
    var w = fieldEls[name];
    if (w) { w.classList.toggle('dirty', v !== orig[name]); w.classList.remove('err'); var m = w.querySelector('.msg'); if (m) m.remove(); }
    var d = slotOf[name];
    if (d) { d.classList.toggle('dirty', slotDirty(d._slot)); d._sum.textContent = slotSummary(d._slot, d._kind); }
    refreshBar();
  }

  // ---------- 級別 ----------
  // level = { mode:'form'|'raw', pretty, origObj, origKeys, rows:[{name, origName, kvs:[{k, v, t}]}], raw, parseError }
  function valueToText(v) { return (typeof v === 'string') ? v : JSON.stringify(v); }

  function initLevel() {
    var raw = orig.levelSettings || '';
    level = { mode: 'form', pretty: raw.indexOf('\n') >= 0, raw: raw, rows: [], origKeys: [], parseError: '' };
    if (raw.trim() === '') { level.origObj = null; return; }
    var obj;
    try { obj = JSON.parse(raw); } catch (e) { level.mode = 'raw'; level.parseError = String(e.message || e); return; }
    if (!obj || typeof obj !== 'object' || Array.isArray(obj) ||
        Object.keys(obj).some(function(k) { return !obj[k] || typeof obj[k] !== 'object' || Array.isArray(obj[k]); })) {
      level.mode = 'raw'; level.parseError = '格式不是 { "級別名稱": { … } }，請用原始碼模式修正'; return;
    }
    level.origObj = obj;
    level.origKeys = Object.keys(obj);
    level.rows = level.origKeys.map(function(name) {
      return { name: name, origName: name, kvs: Object.keys(obj[name]).map(function(k) {
        return { k: k, v: valueToText(obj[name][k]), t: Array.isArray(obj[name][k]) ? 'json' : typeof obj[name][k] };
      }) };
    });
  }

  // 表單 → 物件。回傳 { obj, errors:[] }
  function levelFromForm() {
    var obj = {}, errors = [];
    level.rows.forEach(function(r, i) {
      var name = r.name;
      if (name.trim() === '') { errors.push('第 ' + (i + 1) + ' 個級別沒有名稱'); return; }
      if (Object.prototype.hasOwnProperty.call(obj, name)) { errors.push('級別名稱「' + name + '」重複'); return; }
      var lv = {};
      r.kvs.forEach(function(kv) {
        var k = kv.k.trim();
        if (k === '') { if (kv.v.trim() !== '') errors.push('級別「' + name + '」有一個欄位沒有名稱'); return; }
        if (Object.prototype.hasOwnProperty.call(lv, k)) { errors.push('級別「' + name + '」的欄位「' + k + '」重複'); return; }
        var v = kv.v, tv = v.trim();
        if (kv.t === 'string') { lv[k] = v; return; }
        if (tv === '') { errors.push('級別「' + name + '」的「' + k + '」沒填值（不要的話按 ✕ 刪掉）'); return; }
        if (/^-?\d+(\.\d+)?$/.test(tv)) { lv[k] = parseFloat(tv); return; }
        if (/^[\[{]/.test(tv) || kv.t === 'json' || kv.t === 'object') {
          try { lv[k] = JSON.parse(tv); } catch (e) { errors.push('級別「' + name + '」的「' + k + '」不是正確的 JSON 寫法：' + tv); }
          return;
        }
        if (kv.t === 'boolean' && (tv === 'true' || tv === 'false')) { lv[k] = tv === 'true'; return; }
        if (kv.t === 'number') { errors.push('級別「' + name + '」的「' + k + '」原本是數字，現在填的「' + tv + '」不是數字'); return; }
        lv[k] = v;
      });
      obj[name] = lv;
    });
    return { obj: obj, errors: errors };
  }

  // 依目前編輯狀態更新 cur.levelSettings（語義沒變就維持原字串，不算修改）
  function syncLevel() {
    if (!level) return;
    level.errors = [];
    if (level.mode === 'raw') {
      cur.levelSettings = level.raw;
      if (level.raw.trim() !== '') {
        try { JSON.parse(level.raw); } catch (e) { level.errors.push('JSON 寫法有錯：' + (e.message || e)); }
      }
    } else {
      var res = levelFromForm();
      level.errors = res.errors;
      if (!res.errors.length) {
        var same = level.origObj && JSON.stringify(level.origObj) === JSON.stringify(res.obj);
        if (same) cur.levelSettings = orig.levelSettings;
        else if (!level.rows.length && !level.origObj) cur.levelSettings = orig.levelSettings;
        else cur.levelSettings = level.rows.length ? JSON.stringify(res.obj, null, level.pretty ? 2 : 0) : '';
      }
    }
    var lw = $('levelErrors');
    if (lw) {
      lw.textContent = '';
      level.errors.forEach(function(m) { lw.appendChild(el('div', 'msg', '❌ ' + m)); });
    }
    var w = fieldEls.levelSettings;
    if (w) w.classList.toggle('dirty', cur.levelSettings !== orig.levelSettings);
    refreshBar();
  }

  function renderLevels(main) {
    if (card.levels.indexOf('levelSettings') < 0 && card.levels.indexOf('hasLevels') < 0) return;
    main.appendChild(el('h2', null, '級別設定'));
    main.appendChild(el('div', 'warn', '⚠️ 級別名稱就是識別碼：用戶存的是這串字。改名或刪除級別，存過舊名稱的用戶會被重設成預設級別。要改給用戶看的說明，請改 level-note。第一個級別＝網站預設級別。'));
    card.levels.forEach(function(f) { if (f !== 'levelSettings') main.appendChild(fieldWidget(f)); });
    if (card.levels.indexOf('levelSettings') < 0) return;

    var lsInfo = card.fields.levelSettings;
    var w = el('div', 'field');
    w.dataset.field = 'levelSettings';
    fieldEls.levelSettings = w;
    w.appendChild(el('label', null, 'levelSettings'));
    main.appendChild(w);
    if (lsInfo.readonly) { w.appendChild(el('div', 'ro', lsInfo.value || '（空）')); w.querySelector('label').textContent += '　🔒 公式'; return; }

    if (!level) initLevel();
    var box = el('div');
    w.appendChild(box);
    var errBox = el('div'); errBox.id = 'levelErrors';
    w.appendChild(errBox);

    var toggle = el('button', 'link', level.mode === 'form' ? '改用 JSON 原始碼編輯' : '改回表單編輯');
    toggle.onclick = function() {
      if (level.mode === 'form') {
        var res = levelFromForm();
        if (res.errors.length) { status('表單裡還有錯誤，先修好才能切換', 'err'); return; }
        level.raw = level.rows.length ? JSON.stringify(res.obj, null, 2) : '';
        level.mode = 'raw';
      } else {
        var keepRaw = level.raw, keepPretty = level.pretty;
        var o;
        try { o = level.raw.trim() ? JSON.parse(level.raw) : {}; } catch (e) { status('JSON 寫法有錯，先修好才能切回表單：' + (e.message || e), 'err'); return; }
        if (!o || typeof o !== 'object' || Array.isArray(o) || Object.keys(o).some(function(k) { return !o[k] || typeof o[k] !== 'object' || Array.isArray(o[k]); })) {
          status('格式要是 { "級別名稱": { … } } 才能切回表單', 'err'); return;
        }
        // 名稱跟原本一樣的級別記為「原本就有」，改名提示才對得上（伺服器存檔時另有完整比對）
        level.rows = Object.keys(o).map(function(name) {
          return { name: name, origName: level.origKeys.indexOf(name) >= 0 ? name : null, kvs: Object.keys(o[name]).map(function(k) {
            return { k: k, v: valueToText(o[name][k]), t: Array.isArray(o[name][k]) ? 'json' : typeof o[name][k] };
          }) };
        });
        level.raw = keepRaw; level.pretty = keepPretty; level.mode = 'form';
      }
      renderLevelBody(box);
      toggle.textContent = level.mode === 'form' ? '改用 JSON 原始碼編輯' : '改回表單編輯';
      syncLevel();
    };
    w.querySelector('label').appendChild(toggle);
    if (level.parseError) w.insertBefore(el('div', 'warn', '❌ 目前的 levelSettings 讀不出來（' + level.parseError + '），已切到原始碼模式。'), box);
    renderLevelBody(box);
    syncLevel();
  }

  function renderLevelBody(box) {
    box.textContent = '';
    if (level.mode === 'raw') {
      var ta = el('textarea'); ta.id = 'rawLevels'; ta.value = level.raw; ta.spellcheck = false;
      ta.oninput = function() { level.raw = ta.value; syncLevel(); };
      box.appendChild(ta);
      return;
    }
    if (!level.rows.length) box.appendChild(el('div', 'hint', '目前沒有級別。'));
    level.rows.forEach(function(r, i) {
      var lv = el('div', 'level');
      var head = el('div', 'level-head');
      var nameIn = el('input'); nameIn.type = 'text'; nameIn.value = r.name; nameIn.placeholder = '級別名稱';
      head.appendChild(nameIn);
      if (i === 0) head.appendChild(el('span', 'tag', '預設'));
      var del = el('button', 'link danger', '刪除');
      del.onclick = function() {
        var go = function() { level.rows.splice(i, 1); renderLevelBody(box); syncLevel(); };
        if (r.origName) confirmBox('刪除級別「' + r.origName + '」？', '存過這個級別的用戶會被重設成預設級別。存檔時還會再提醒一次。', '刪除', go);
        else go();
      };
      head.appendChild(del);
      lv.appendChild(head);
      var note = el('div', 'warn'); note.style.display = 'none';
      lv.appendChild(note);
      var showRename = function() {
        var renamed = r.origName && r.name !== r.origName;
        lv.classList.toggle('renamed', !!renamed);
        note.style.display = renamed ? '' : 'none';
        note.textContent = renamed ? '⚠️ 改名：原本叫「' + r.origName + '」。存過舊名稱的用戶會對不上，被重設成預設級別。' : '';
      };
      nameIn.oninput = function() { r.name = nameIn.value; showRename(); syncLevel(); };
      showRename();

      r.kvs.forEach(function(kv, j) {
        var row = el('div', 'kv');
        var k = el('input'); k.type = 'text'; k.value = kv.k; k.placeholder = '欄位（如 rate）';
        var v = el('textarea'); v.rows = 1; v.value = kv.v; v.placeholder = '值';
        var x = el('button', null, '✕'); x.title = '刪除這個欄位';
        k.oninput = function() { kv.k = k.value; syncLevel(); };
        v.oninput = function() { kv.v = v.value; autoSize(v); syncLevel(); };
        x.onclick = function() { r.kvs.splice(j, 1); renderLevelBody(box); syncLevel(); };
        row.appendChild(k); row.appendChild(v); row.appendChild(x);
        lv.appendChild(row);
        setTimeout(function() { autoSize(v); }, 0);
      });
      var addKv = el('button', 'link', '＋ 欄位');
      addKv.onclick = function() { r.kvs.push({ k: '', v: '', t: 'new' }); renderLevelBody(box); syncLevel(); };
      lv.appendChild(addKv);
      box.appendChild(lv);
    });
    var addLv = el('button', 'add-slot', '＋ 新增級別');
    addLv.onclick = function() {
      var tpl = level.rows.length ? level.rows[level.rows.length - 1].kvs.map(function(kv) { return { k: kv.k, v: '', t: 'new' }; })
        : [{ k: 'rate', v: '', t: 'new' }, { k: 'cap', v: '', t: 'new' }, { k: 'level-note', v: '', t: 'string' }];
      level.rows.push({ name: '', origName: null, kvs: tpl });
      renderLevelBody(box); syncLevel();
    };
    box.appendChild(addLv);
  }

  // ---------- 存檔 ----------
  function changedNames() { return Object.keys(cur).filter(function(k) { return cur[k] !== orig[k]; }); }
  function countChanges() { return card ? changedNames().length : 0; }

  function refreshBar() {
    var n = countChanges();
    var b = $('saveBtn');
    var levelBad = level && level.errors && level.errors.length;
    b.disabled = busy || n === 0 || !!levelBad;
    b.textContent = busy ? '處理中…' : levelBad ? '級別設定有錯，先修正' : n === 0 ? '沒有修改' : '💾 儲存（' + n + ' 格）';
  }

  function clearMarks() {
    $('issues').textContent = '';
    document.querySelectorAll('.field.err').forEach(function(w) { w.classList.remove('err'); var m = w.querySelector('.msg'); if (m) m.remove(); });
    document.querySelectorAll('details.has-err').forEach(function(d) { d.classList.remove('has-err'); });
  }

  function markField(name, msg) {
    var w = fieldEls[name];
    if (!w) return;
    w.classList.add('err');
    w.appendChild(el('div', 'msg', msg));
    var d = slotOf[name];
    if (d) { d.classList.add('has-err'); d.open = true; d.classList.remove('empty'); }
  }

  function gotoField(name) {
    var d = slotOf[name]; if (d) d.open = true;
    var w = fieldEls[name]; if (!w) return;
    w.scrollIntoView({ block: 'center', behavior: 'smooth' });
    var i = w.querySelector('textarea, input'); if (i) i.focus();
  }

  function save(confirmLevelChange) {
    var names = changedNames();
    if (!names.length) return;
    var changes = {};
    names.forEach(function(k) { changes[k] = { original: orig[k], value: cur[k] }; });
    clearMarks();
    status('存檔中…');
    refreshBar();
    run('cardEditorSave', [{ id: card.id, changes: changes, confirmLevelChange: !!confirmLevelChange }], function(res) {
      if (res.ok) {
        setCard(res.card);
        var msg = '✅ 已存檔：' + res.saved.join('、');
        if (res.dateMismatch && res.dateMismatch.length) {
          status(msg + '。⚠️ 但這幾格日期存進表後讀回來對不上，請到表上確認：' + res.dateMismatch.join('、'), 'err');
        } else status(msg, 'ok');
        return;
      }
      refreshBar();
      if (res.levelWarning) {
        var w = res.levelWarning, lines = [];
        if (w.removed.length) lines.push('這些級別名稱會消失：' + w.removed.join('、'));
        if (w.added.length) lines.push('新增的名稱：' + w.added.join('、'));
        if (w.defaultChanged) lines.push('網站預設級別會從「' + w.oldDefault + '」變成「' + w.newDefault + '」');
        lines.push('', '存過舊名稱的用戶會對不上，被重設成預設級別，要重新選。如果只是想改給用戶看的說明，請改 level-note，不要改名稱。', '', '確定要這樣存嗎？');
        confirmBox('⚠️ 級別名稱被改動', lines.join('\n'), '我確定，存檔', function() { save(true); }, function() { status('已取消，什麼都沒寫入'); });
        status('等待確認級別改動…');
        return;
      }
      var box = $('issues');
      if (res.conflicts) {
        box.appendChild(el('div', 'issue conflict', '⚠️ 以下欄位在你打開編輯器之後，表上被改過了。為了不蓋掉別人的修改，這次什麼都沒寫入：'));
        res.conflicts.forEach(function(c) {
          box.appendChild(el('div', 'issue conflict', c.field + '：表上現在是「' + (c.sheetValue || '（空）') + '」，你打開時是「' + (c.yourOriginal || '（空）') + '」'));
        });
        var rl = el('button', null, '重新載入這張卡（會放棄你還沒存的修改）');
        rl.onclick = function() { loadCard(card.id); };
        box.appendChild(rl);
        status('❌ 有衝突，沒有存檔', 'err');
        return;
      }
      if (res.errors) {
        box.appendChild(el('div', 'hint', '❌ 有 ' + res.errors.length + ' 個問題，這次什麼都沒寫入。點一下可跳到該欄：'));
        res.errors.forEach(function(it) {
          var d = el('div', 'issue');
          d.appendChild(el('b', null, it.slotLabel + '：'));
          d.appendChild(document.createTextNode(it.message));
          d.onclick = function() { gotoField(it.field); };
          box.appendChild(d);
          markField(it.field, it.message);
        });
        status('❌ 驗證沒過，沒有存檔', 'err');
        return;
      }
      status('❌ ' + (res.message || '存檔失敗'), 'err');
    });
  }

  $('saveBtn').onclick = function() { save(false); };
  $('revertBtn').onclick = function() {
    if (!card || !countChanges()) return;
    confirmBox('放棄修改？', '還沒存的 ' + countChanges() + ' 項修改會還原成打開時的樣子。', '還原', function() {
      setCard(card); status('已還原');
    });
  };

  // 啟動
  run('cardEditorListCards', [], function(list) {
    allCards = list;
    renderCardList();
    status('共 ' + list.length + ' 張卡');
  });
})();
</script>
</body>
</html>
